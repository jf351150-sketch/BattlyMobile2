name: Nexus Sensitivity Android APK
on:
  workflow_dispatch:
  push:
    branches: [nexus-development]
    paths:
      - 'nexus_sensitivity_android/**'
      - '.github/workflows/nexus-sensitivity-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Nexus Sensitivity APK
        working-directory: nexus_sensitivity_android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-sensitivity-v1-apk
          path: nexus_sensitivity_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
